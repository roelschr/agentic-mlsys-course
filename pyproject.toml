[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-mlsys-course"
version = "0.1.0"
description = "Unsolved, test-driven MLSys refresher drills"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["drills*", "capstone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "cuda: optional CUDA-only allocation check",
    "week9: decoder and SFT gates, before DPO and caching integration",
]
